version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      - run:
          name: Install build dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              build-essential bc bison flex libssl-dev \
              git zip curl wget rsync cpio libncurses5

      - run:
          name: Clone kernel repo and toolchains
          command: |
            set -e
            git clone --depth=1 --branch stock_a90 \
              https://github.com/young0103/samsung_a90_kernel kernel
            cd kernel
            clone() { rm -rf "$2"; git clone --depth=1 "$1" "$2"; }
            clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 aarch64-linux-android-4.9
            clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9   arm-linux-androideabi-4.9
            clone https://github.com/prorooter007/android_prebuilts_clang_host_linux-x86_clang-6877366              clang-r383902
            clone https://github.com/osm0sis/AnyKernel3  AnyKernel3
            mkdir -p toolchain/gcc/linux-x86/{aarch64,arm} toolchain/clang/host/linux-x86
            ln -sf ../../../../aarch64-linux-android-4.9   toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
            ln -sf ../../../../arm-linux-androideabi-4.9   toolchain/gcc/linux-x86/arm/arm-linux-androideabi-4.9
            ln -sf ../../../../clang-r383902               toolchain/clang/host/linux-x86/clang-r383902

      - run:
          name: Patch kconfig Makefile (add missing objects)
          command: |
            cd kernel/scripts/kconfig

            # hostlibs‑y 줄이 없다면 안전용으로 추가
            grep -q "hostlibs-y" Makefile || \
              sed -i '/hostprogs-y.*/a hostlibs-y  :=' Makefile

            # conf-objs 에 필수 *.o 가 없다면 += 로 한 줄 삽입
            grep -q "confdata.o" Makefile || \
              echo 'conf-objs += confdata.o expr.o lexer.o preprocess.o symbol.o util.o menu.o' >> Makefile



      - run:
          name: Patch gcc-wrapper (Python 3 print)
          command: |
            sed -i 's/print >> sys.stderr, \(.*\)/print(\1, file=sys.stderr)/' \
                kernel/scripts/gcc-wrapper.py || true

      - run:
          name: Build kernels
          command: |
            set -e
            cd kernel
            export ARCH=arm64
            export CC=clang
            export LLVM=1
            export CROSS_COMPILE=aarch64-linux-android-
            export CROSS_COMPILE_COMPAT=arm-linux-androideabi-
            export PATH="$PWD/toolchain/clang/host/linux-x86/clang-r383902/bin:$PWD/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin:$PWD/toolchain/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin:$PATH"

            build_once () {
              local OUT=$1
              # host kconfig tool (모든 객체 포함)
              make -C scripts/kconfig HOSTCC=gcc conf
            
              cp arch/arm64/configs/r3q_kor_single_defconfig .config
              scripts/kconfig/conf --syncconfig Kconfig
            
              mkdir -p "$OUT"
              cp .config "$OUT"
              make O="$OUT" -j"$(nproc)"
            }

            build_once out-stock
            git apply gsi-commits.patch
            build_once out-gsi

      - store_artifacts:
          path: kernel/out-stock
          destination: stock-build
      - store_artifacts:
          path: kernel/out-gsi
          destination: gsi-build

workflows:
  version: 2
  build-and-upload:
    jobs:
      - build-kernel
