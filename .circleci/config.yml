version: 2.1
executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      - run: { name: Install build deps, command: | … }
      - run: { name: Clone kernel repo & toolchains, command: | … }

      # (선택) 1단계 패치 – 이미 라인이 있으면 이 스텝은 건너뜀
      - run: { name: Patch kconfig Makefile, command: | <위 apply_patch 블록> }

      - run: { name: Patch gcc-wrapper, command: | … }

      # 2단계 build_once() 포함
      - run: { name: Build kernels, command: | <위 build_once 블록> }

      - store_artifacts: { path: kernel/out-stock, destination: stock-build }
      - store_artifacts: { path: kernel/out-gsi,   destination: gsi-build }

workflows:
  version: 2
  build-and-upload:
    jobs: [build-kernel]
