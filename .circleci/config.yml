version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec

    steps:
      # 1) 필수 패키지 설치
      - run:
          name: Install build dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              build-essential bc bison flex libssl-dev \
              git zip curl wget rsync cpio libncurses5

      # 2) 커널 및 툴체인 클론
      - run:
          name: Clone kernel repo and toolchains
          command: |
            set -e
            git clone --depth=1 --branch stock_a90 \
              https://github.com/young0103/samsung_a90_kernel kernel
            cd kernel
            clone() { rm -rf "$2"; git clone --depth=1 "$1" "$2"; }
            clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 aarch64-linux-android-4.9
            clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9   arm-linux-androideabi-4.9
            clone https://github.com/prorooter007/android_prebuilts_clang_host_linux-x86_clang-6877366              clang-r383902
            clone https://github.com/osm0sis/AnyKernel3  AnyKernel3

            mkdir -p toolchain/gcc/linux-x86/{aarch64,arm} toolchain/clang/host/linux-x86
            ln -sf ../../../../aarch64-linux-android-4.9   toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
            ln -sf ../../../../arm-linux-androideabi-4.9   toolchain/gcc/linux-x86/arm/arm-linux-androideabi-4.9
            ln -sf ../../../../clang-r383902               toolchain/clang/host/linux-x86/clang-r383902

      # 3) (필요 시) kconfig Makefile 패치
      - run:
          name: Patch kconfig Makefile (add libkconfig rule)
          command: |
            cd kernel
            grep -q "hostlibs-y.*libkconfig" scripts/kconfig/Makefile && exit 0
            patch -p1 <<'EOF'
--- a/scripts/kconfig/Makefile
+++ b/scripts/kconfig/Makefile
@@
-hostprogs-y := conf nconf mconf kxgettext qconf gconf
+hostprogs-y := conf nconf mconf kxgettext qconf gconf
+hostlibs-y  := libkconfig
+
+libkconfig-objs := confdata.o expr.o lexer.o preprocess.o symbol.o util.o menu.o
EOF

      # 4) Python 2 전용 print 구문 수정
      - run:
          name: Patch gcc-wrapper (Python 3)
          command: |
            sed -i 's/print >> sys.stderr, \(.*\)/print(\1, file=sys.stderr)/' \
                kernel/scripts/gcc-wrapper.py || true

      # 5) 커널 빌드 (stock & GSI)
      - run:
          name: Build kernels
          command: |
            set -e
            cd kernel
            export ARCH=arm64
            export CC=clang
            export LLVM=1
            export CROSS_COMPILE=aarch64-linux-android-
            export CROSS_COMPILE_COMPAT=arm-linux-androideabi-
            export PATH="$PWD/toolchain/clang/host/linux-x86/clang-r383902/bin:\
$PWD/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin:\
$PWD/toolchain/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin:$PATH"

            build_once () {
              local OUT=$1

              # 0) libkconfig.a + conf 빌드 (Qt 미사용)
              make -C scripts/kconfig HOSTCC=gcc libkconfig conf

              # 1) defconfig → .config
              cp arch/arm64/configs/r3q_kor_single_defconfig .config

              # 2) 옵션 동기화
              scripts/kconfig/conf --syncconfig Kconfig

              # 3) 커널(out‑of‑tree) 빌드
              mkdir -p "$OUT"
              cp .config "$OUT"
              make O="$OUT" -j"$(nproc)"
            }

            build_once out-stock
            git apply gsi-commits.patch
            build_once out-gsi

      # 6) 결과물 저장
      - store_artifacts:
          path: kernel/out-stock
          destination: stock-build
      - store_artifacts:
          path: kernel/out-gsi
          destination: gsi-build

workflows:
  version: 2
  build-and-upload:
    jobs:
      - build-kernel
